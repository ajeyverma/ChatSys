<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ChatSys — Primary Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b18;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Title Bar */
        .titlebar {
            height: 42px;
            background: #07070f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 0;
            -webkit-app-region: drag;
            border-bottom: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tb-role-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(34, 197, 94, .15);
            color: #22c55e;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: .6px;
        }

        .titlebar-title {
            font-size: 12px;
            color: #475569;
        }

        .titlebar-btns {
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag;
        }

        .win-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .win-btn svg {
            width: 10px;
            height: 10px;
            fill: #94a3b8;
        }

        .win-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .win-btn:hover svg {
            fill: #e2e8f0;
        }

        .win-btn.win-close:hover {
            background: #e81123;
        }

        .win-btn.win-close:hover svg {
            fill: #ffffff;
        }

        /* Layout */
        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            background: #0d0d1f;
            border-right: 1px solid #1a1a30;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            border-bottom: 1px solid #1a1a30;
        }

        .status-card {
            background: #111128;
            border: 1px solid #1e1e3a;
            border-radius: 12px;
            padding: 16px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0;
            box-shadow: 0 0 8px #22c55e;
        }

        .pulse-dot.active {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 4px #22c55e;
            }

            50% {
                box-shadow: 0 0 14px #22c55e, 0 0 4px #22c55e;
            }
        }

        .status-label {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .status-sub {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        .stats-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .stat {
            flex: 1;
            background: #0b0b18;
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: #6366f1;
        }

        .stat-lbl {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        /* Heartbeat row */
        .hb-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            background: #0b0b18;
            border-radius: 8px;
            padding: 7px 10px;
        }

        .hb-icon {
            font-size: 13px;
        }

        .hb-text {
            font-size: 11px;
            color: #64748b;
        }

        .hb-count {
            font-size: 11px;
            font-weight: 600;
            color: #6366f1;
            margin-left: auto;
        }

        /* Client List */
        .section-title {
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: .8px;
            padding: 14px 18px 8px;
        }

        .client-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }

        .client-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            background: #111128;
            margin-bottom: 6px;
            border: 1px solid #1e1e3a;
        }

        .client-avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .client-name {
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .client-ip {
            font-size: 10px;
            color: #64748b;
        }

        .no-clients {
            text-align: center;
            color: #374151;
            font-size: 12px;
            padding: 24px 12px;
        }

        /* Broadcast */
        .broadcast-area {
            padding: 12px 18px;
            border-top: 1px solid #1a1a30;
        }

        .broadcast-area label {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .broadcast-row {
            display: flex;
            gap: 8px;
        }

        .broadcast-row input {
            flex: 1;
            background: #0b0b18;
            border: 1px solid #2d2d4e;
            border-radius: 8px;
            padding: 8px 10px;
            color: #e2e8f0;
            font-size: 12px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .broadcast-row input:focus {
            border-color: #6366f1;
        }

        .btn-broadcast {
            background: #1e3a5f;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }

        .btn-broadcast:hover {
            background: #1e40af;
        }

        /* Log Panel */
        .log-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            padding: 20px 20px 14px;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .btn-clear {
            background: none;
            border: 1px solid #1e1e3a;
            border-radius: 6px;
            padding: 4px 10px;
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-clear:hover {
            border-color: #374151;
            color: #94a3b8;
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11.5px;
            line-height: 1.7;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #12122080;
            color: #94a3b8;
        }

        .log-entry .ts {
            color: #374151;
            margin-right: 8px;
        }

        .log-entry.info .ts {
            color: #6366f1;
        }

        .log-entry.warn {
            color: #fbbf24;
        }

        .log-entry.err {
            color: #f87171;
        }

        /* === Messaging Console === */
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .panel-tab {
            flex: 1;
            padding: 9px 0;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .2s;
        }

        .panel-tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .panel-content {
            flex: 1;
            overflow: hidden;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            /* Pin to bottom if feed is too small */
        }

        .panel-content.active {
            display: flex;
        }

        /* chat feed */
        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .feed-msg {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .feed-msg.srv {
            align-self: flex-end;
            align-items: flex-end;
        }

        .feed-msg.client {
            align-self: flex-start;
            align-items: flex-start;
        }

        .feed-msg.sys {
            align-self: center;
            align-items: center;
            max-width: 90%;
        }

        .feed-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .feed-msg.srv .feed-bubble {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border-radius: 12px 12px 4px 12px;
        }

        .feed-msg.client .feed-bubble {
            background: #161628;
            border: 1px solid #252545;
            color: #e2e8f0;
            border-radius: 12px 12px 12px 4px;
        }

        .feed-msg.sys .feed-bubble {
            background: #111128;
            border: 1px solid #252545;
            color: #64748b;
            font-size: 11px;
            border-radius: 20px;
            padding: 4px 14px;
            text-align: center;
        }

        .feed-img {
            max-width: 180px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #252545;
        }

        .feed-img img {
            width: 100%;
            display: block;
        }

        .feed-name {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 2px;
            font-weight: 600;
            padding: 0 2px;
        }

        .feed-meta {
            font-size: 9px;
            color: #475569;
            margin-top: 2px;
            padding: 0 2px;
        }

        /* console send area */
        .console-area {
            padding: 10px 14px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .console-target {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .console-target label {
            font-size: 10px;
            color: #64748b;
            white-space: nowrap;
        }

        .console-target select {
            flex: 1;
            background: #111128;
            border: 1px solid #252545;
            border-radius: 6px;
            padding: 4px 8px;
            color: #e2e8f0;
            font-size: 11px;
            font-family: inherit;
            outline: none;
        }

        .console-row {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .console-input {
            flex: 1;
            background: #111128;
            border: 1px solid #252545;
            border-radius: 10px;
            padding: 8px 12px;
            color: #e2e8f0;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 60px;
        }

        .console-input:focus {
            border-color: #22c55e;
        }

        .btn-console-img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #161628;
            border: 1px solid #252545;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-console-img:hover {
            border-color: #22c55e;
        }

        .btn-console-send {
            height: 34px;
            padding: 0 14px;
            border-radius: 8px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-console-send:hover {
            opacity: .9;
        }

        /* image preview bar */
        .img-preview-bar {
            display: none;
            padding: 8px 14px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            align-items: center;
            gap: 10px;
        }

        .img-preview-bar.visible {
            display: flex;
        }

        .img-preview-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #252545;
        }

        .img-preview-name {
            font-size: 11px;
            color: #94a3b8;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-cancel-img {
            background: none;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 3px 10px;
            color: #64748b;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel-img:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* clickable client item */
        .client-item {
            cursor: pointer;
        }

        .client-item:hover {
            background: #1a1a30;
        }

        .client-item .dm-btn {
            font-size: 9px;
            color: #6366f1;
            margin-left: auto;
            padding: 2px 6px;
            border: 1px solid #2d2d4e;
            border-radius: 4px;
            display: none;
        }

        .client-item:hover .dm-btn {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d2d4e;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="titlebar">
        <div class="titlebar-left">
            <span class="tb-role-badge">PRIMARY SERVER</span>
            <span class="titlebar-title">Active Coordinator Node</span>
        </div>
        <div class="titlebar-btns">
            <div class="win-btn win-min" onclick="api.send('win-minimize',{})">
                <svg viewBox="0 0 10 1">
                    <rect x="0" y="0" width="10" height="1"></rect>
                </svg>
            </div>
            <div class="win-btn win-max" onclick="api.send('win-maximize',{})">
                <svg viewBox="0 0 10 10">
                    <path d="M0,0v10h10V0H0z M9,9H1V1h8V9z"></path>
                </svg>
            </div>
            <div class="win-btn win-close" onclick="api.send('win-close',{})">
                <svg viewBox="0 0 10 10">
                    <polygon points="10,0.7 9.3,0 5,4.3 0.7,0 0,0.7 4.3,5 0,9.3 0.7,10 5,5.7 9.3,10 10,9.3 5.7,5">
                    </polygon>
                </svg>
            </div>
        </div>
    </div>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="status-card">
                    <div class="status-row">
                        <div class="pulse-dot active" id="status-dot"></div>
                        <div>
                            <div class="status-label" id="status-text">ACTIVE</div>
                            <div class="status-sub" id="status-sub">Listening on port 65432</div>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat">
                            <div class="stat-val" id="stat-clients">0</div>
                            <div class="stat-lbl">Clients</div>
                        </div>
                        <div class="stat">
                            <div class="stat-val" id="stat-msgs">0</div>
                            <div class="stat-lbl">Messages</div>
                        </div>
                    </div>
                    <div class="hb-row">
                        <span class="hb-icon">💓</span>
                        <span class="hb-text">Heartbeats sent</span>
                        <span class="hb-count" id="stat-hb">0</span>
                    </div>
                </div>
            </div>

            <div class="section-title">Connected Clients</div>
            <div class="client-list" id="client-list">
                <div class="no-clients" id="no-clients">No clients connected</div>
            </div>

            <div class="broadcast-area">
                <label>Broadcast System Message</label>
                <div class="broadcast-row">
                    <input type="text" id="broadcast-input" placeholder="Type announcement..." />
                    <button class="btn-broadcast" onclick="broadcast()">Send</button>
                </div>
            </div>
        </div>

        <!-- Main Panel (tabbed: Log + Chat Feed) -->
        <div class="log-panel" style="display:flex;flex-direction:column;">
            <!-- Hidden image input for server -->
            <input type="file" id="srv-file-picker" accept="image/*" style="display:none;" />

            <!-- Tabs -->
            <div class="panel-tabs">
                <div class="panel-tab active" id="tab-log" onclick="switchTab('log')">📋 Server Log</div>
                <div class="panel-tab" id="tab-chat" onclick="switchTab('chat')">💬 Chat Console</div>
            </div>

            <!-- Log Tab -->
            <div class="panel-content active" id="pane-log" style="flex-direction:column;">
                <div class="log-header">
                    <h2>📋 Server Log</h2>
                    <button class="btn-clear" onclick="clearLog()">Clear</button>
                </div>
                <div class="log-body" id="log-body"></div>
            </div>

            <!-- Chat Console Tab -->
            <div class="panel-content" id="pane-chat" style="flex-direction:column;">
                <div class="feed" id="chat-feed"></div>

                <!-- Image preview bar -->
                <div class="img-preview-bar" id="img-preview-bar">
                    <img class="img-preview-thumb" id="img-preview-thumb" src="" alt="preview" />
                    <span class="img-preview-name" id="img-preview-name"></span>
                    <button class="btn-cancel-img" onclick="cancelSrvImage()">✕ Cancel</button>
                </div>

                <div class="console-area">
                    <div class="console-target">
                        <label>To:</label>
                        <select id="dm-target-select">
                            <option value="">Everyone (Group)</option>
                        </select>
                    </div>
                    <div class="console-row">
                        <button class="btn-console-img" title="Send image" onclick="srvPickImage()">📎</button>
                        <textarea class="console-input" id="console-input" placeholder="Type message as Server..."
                            rows="1"></textarea>
                        <button class="btn-console-send" onclick="serverSend()">Send ➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const clients = {};
        let msgCount = 0;
        let srvPendingImage = null;

        function switchTab(tab) {
            document.getElementById('tab-log').classList.toggle('active', tab === 'log');
            document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
            document.getElementById('pane-log').classList.toggle('active', tab === 'log');
            document.getElementById('pane-chat').classList.toggle('active', tab === 'chat');
        }

        function addLog(line, type = 'info') {
            const body = document.getElementById('log-body');
            const el = document.createElement('div');
            el.className = `log-entry ${type}`;
            el.innerHTML = `<span class="ts">&gt;</span> ${escapeHtml(line)}`;
            body.appendChild(el);
            body.scrollTop = body.scrollHeight;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function clearLog() {
            document.getElementById('log-body').innerHTML = '';
        }

        function broadcast() {
            const input = document.getElementById('broadcast-input');
            const text = input.value.trim();
            if (!text) return;
            api.send('server-broadcast', { text });
            input.value = '';
            addLog(`[BROADCAST] ${text}`, 'warn');
        }

        // ─── Server Admin Send ──────────────────────────────────────
        function serverSend() {
            const text = document.getElementById('console-input').value.trim();
            const to = document.getElementById('dm-target-select').value;

            if (srvPendingImage) {
                api.send('server-send-image', {
                    to: to || null,
                    data: srvPendingImage.data,
                    filename: srvPendingImage.filename,
                    mimeType: srvPendingImage.mimeType
                });
                cancelSrvImage();
            } else if (text) {
                if (to) {
                    api.send('server-send-dm', { to, text });
                } else {
                    api.send('server-send-msg', { text });
                }
            }
            document.getElementById('console-input').value = '';
        }

        function srvPickImage() {
            document.getElementById('srv-file-picker').click();
        }

        document.getElementById('srv-file-picker').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Image too large (max 5MB)'); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                srvPendingImage = { data: ev.target.result, filename: file.name, mimeType: file.type };
                document.getElementById('img-preview-thumb').src = ev.target.result;
                document.getElementById('img-preview-name').textContent = file.name;
                document.getElementById('img-preview-bar').classList.add('visible');
                document.getElementById('console-input').placeholder = 'Add a caption (optional)...';
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function cancelSrvImage() {
            srvPendingImage = null;
            document.getElementById('img-preview-bar').classList.remove('visible');
            document.getElementById('console-input').placeholder = 'Type message as Server...';
        }


        // ─── Chat Feed Render ───────────────────────────────────────
        function addFeedMsg(data) {
            const feed = document.getElementById('chat-feed');
            const isSrv = data.from === '🖥️ Server';
            const wrap = document.createElement('div');
            if (data.system) {
                wrap.className = 'feed-msg sys';
                wrap.innerHTML = `<div class="feed-bubble">${escapeHtml(data.text)}</div>`;
            } else if (data.image) {
                wrap.className = `feed-msg ${isSrv ? 'srv' : 'client'}`;
                if (!isSrv) wrap.innerHTML += `<div class="feed-name">${escapeHtml(data.from)}</div>`;
                wrap.innerHTML += `<div class="feed-img"><img src="${data.imgData}" /></div><div class="feed-meta">${fmtTime(data.ts)} · 📎 ${escapeHtml(data.filename)} <a href="${data.imgData}" download="${escapeHtml(data.filename)}" style="color:#6366f1;text-decoration:none;margin-left:8px;" title="Download image">⬇ dl</a></div>`;
            } else {
                wrap.className = `feed-msg ${isSrv ? 'srv' : 'client'}`;
                if (!isSrv) wrap.innerHTML += `<div class="feed-name">${escapeHtml(data.from)}</div>`;
                wrap.innerHTML += `<div class="feed-bubble">${escapeHtml(data.text)}</div><div class="feed-meta">${fmtTime(data.ts)}</div>`;
            }
            feed.appendChild(wrap);
            feed.scrollTop = feed.scrollHeight;
        }

        function fmtTime(ts) { return new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

        function updateDMSelect(keys) {
            const sel = document.getElementById('dm-target-select');
            const cur = sel.value;
            sel.innerHTML = '<option value="">Everyone (Group)</option>';
            for (const k of keys) sel.innerHTML += `<option value="${escapeHtml(k)}"${k === cur ? ' selected' : ''}>${escapeHtml(k)}</option>`;
        }

        // ─── Client List Render ─────────────────────────────────────
        function renderClients() {
            const list = document.getElementById('client-list');
            const noClients = document.getElementById('no-clients');
            const keys = Object.keys(clients);
            document.getElementById('stat-clients').textContent = keys.length;
            updateDMSelect(keys);
            if (keys.length === 0) {
                noClients.style.display = 'block';
                list.querySelectorAll('.client-item').forEach(i => i.remove());
                return;
            }
            noClients.style.display = 'none';
            list.querySelectorAll('.client-item').forEach(i => i.remove());

            // Add Group Chat at the top
            const grpEl = document.createElement('div');
            grpEl.className = 'client-item';
            grpEl.title = 'Click to chat with Everyone';
            grpEl.onclick = () => {
                switchTab('chat');
                document.getElementById('dm-target-select').value = '';
                document.getElementById('console-input').focus();
            };
            grpEl.innerHTML = `
                <div class="client-avatar" style="background:#10b981;">🌐</div>
                <div><div class="client-name">Everyone (Group)</div><div class="client-ip">Broadcast</div></div>
                <span class="dm-btn">Chat</span>`;
            list.appendChild(grpEl);
            for (const [key, info] of Object.entries(clients)) {
                const el = document.createElement('div');
                el.className = 'client-item';
                el.title = `Click to DM ${info.username}`;
                el.onclick = () => {
                    switchTab('chat');
                    document.getElementById('dm-target-select').value = info.username;
                    document.getElementById('console-input').focus();
                };
                el.innerHTML = `
                    <div class="client-avatar">${info.username.charAt(0).toUpperCase()}</div>
                    <div><div class="client-name">${escapeHtml(info.username)}</div><div class="client-ip">${escapeHtml(info.address)}</div></div>
                    <span class="dm-btn">DM</span>`;
                list.appendChild(el);
            }
        }

        // ─── IPC Listeners ──────────────────────────────────────────
        api.on('log', (line) => addLog(line));
        api.on('status', (data) => {
            const dot = document.getElementById('status-dot');
            const label = document.getElementById('status-text');
            if (data.status === 'ACTIVE') {
                dot.style.background = '#22c55e'; dot.style.boxShadow = '0 0 8px #22c55e';
                label.textContent = 'ACTIVE'; label.style.color = '#22c55e';
            } else if (data.status === 'RECOVERING') {
                dot.style.background = '#f59e0b'; dot.style.boxShadow = '0 0 8px #f59e0b';
                label.textContent = 'RECOVERING…'; label.style.color = '#f59e0b';
                addLog('⏳ Backup holds the port. Recovery signal sent. Waiting to reclaim...', 'warn');
            } else if (data.status === 'STARTING') {
                dot.style.background = '#6366f1'; dot.style.boxShadow = '0 0 8px #6366f1';
                label.textContent = 'STARTING'; label.style.color = '#94a3b8';
            }
            if (data.port) document.getElementById('status-sub').textContent = `Listening on port ${data.port}`;
        });

        api.on('client-connected', (data) => {
            clients[data.username] = data;
            renderClients();
            addLog(`✅ ${data.username} connected from ${data.address}`, 'info');
            addFeedMsg({ system: true, text: `${data.username} joined`, ts: Date.now() });
        });
        api.on('client-disconnected', (data) => {
            delete clients[data.username];
            renderClients();
            addLog(`🔴 ${data.username} disconnected`, 'warn');
            addFeedMsg({ system: true, text: `${data.username} left`, ts: Date.now() });
        });
        api.on('chat-message', (data) => {
            addFeedMsg(data);
            if (!data.self) { msgCount++; document.getElementById('stat-msgs').textContent = msgCount; }
        });
        api.on('dm-message', (data) => {
            addFeedMsg({ ...data, text: `🔒 [DM→${data.to}] ${data.text}` });
        });
        api.on('message-relayed', (data) => {
            msgCount = data.count;
            document.getElementById('stat-msgs').textContent = msgCount;
        });
        api.on('heartbeat-sent', (data) => {
            document.getElementById('stat-hb').textContent = data.count;
        });
        api.on('error', (data) => addLog(`ERROR: ${data.message}`, 'err'));

        document.getElementById('broadcast-input').addEventListener('keydown', e => { if (e.key === 'Enter') broadcast(); });
        document.getElementById('console-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); serverSend(); } });
    </script>
</body>

</html>
