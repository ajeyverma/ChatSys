<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ChatSys — Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0b0b18;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ─── Title Bar ─────────────────────────────────────────── */
        .titlebar {
            height: 42px;
            background: #07070f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            -webkit-app-region: drag;
            border-bottom: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tb-role-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(168, 85, 247, .15);
            color: #a855f7;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: .6px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #111128;
            border: 1px solid #1e1e3a;
            border-radius: 20px;
            padding: 3px 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #374151;
            transition: background .3s;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.reconnecting {
            background: #f59e0b;
            animation: blink .8s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        .status-pill-text {
            font-size: 10px;
            color: #64748b;
        }

        .titlebar-btns {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .tb-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .tb-btn.close {
            background: #ff5f57;
        }

        .tb-btn.min {
            background: #febc2e;
        }

        /* ─── Main Layout ───────────────────────────────────────── */
        .app-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 200px 1fr;
            overflow: hidden;
        }

        /* ─── Users Sidebar ─────────────────────────────────────── */
        .users-sidebar {
            background: #0d0d1f;
            border-right: 1px solid #1a1a30;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 14px 14px 10px;
            border-bottom: 1px solid #1a1a30;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s;
            position: relative;
        }

        .user-item:hover {
            background: #161628;
        }

        .user-item.active-dm {
            background: rgba(168, 85, 247, .12);
            border: 1px solid rgba(168, 85, 247, .25);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 12px;
            color: #c4c9d4;
            flex: 1;
        }

        .user-name.me {
            color: #a855f7;
        }

        .unread-badge {
            width: 16px;
            height: 16px;
            background: #a855f7;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dm-hint {
            font-size: 9px;
            color: #374151;
            padding: 6px 8px 2px;
            font-style: italic;
        }

        /* ─── Chat Main ─────────────────────────────────────────── */
        .chat-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* chat mode indicator */
        .chat-mode-bar {
            padding: 6px 16px;
            background: #0d0d1f;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #64748b;
            flex-shrink: 0;
        }

        .chat-mode-bar .mode-label {
            font-weight: 600;
        }

        .chat-mode-bar.dm-mode {
            background: rgba(168, 85, 247, .07);
            border-bottom-color: rgba(168, 85, 247, .3);
        }

        .chat-mode-bar.dm-mode .mode-label {
            color: #a855f7;
        }

        .btn-back-to-group {
            margin-left: auto;
            background: none;
            border: 1px solid #2d2d4e;
            border-radius: 6px;
            padding: 3px 10px;
            color: #64748b;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-back-to-group:hover {
            border-color: #a855f7;
            color: #a855f7;
        }

        /* messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-wrap {
            display: flex;
            flex-direction: column;
            max-width: 72%;
        }

        .msg-wrap.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrap.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-wrap.system {
            align-self: center;
            align-items: center;
            max-width: 85%;
        }

        .msg-wrap.dm-self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrap.dm-other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 9px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-wrap.self .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
        }

        .msg-wrap.other .msg-bubble {
            background: #161628;
            border: 1px solid #252545;
            color: #e2e8f0;
            border-radius: 14px 14px 14px 4px;
        }

        .msg-wrap.system .msg-bubble {
            background: #111128;
            border: 1px solid #252545;
            color: #64748b;
            font-size: 11px;
            text-align: center;
            border-radius: 20px;
            padding: 4px 14px;
        }

        /* DM bubbles — purple tinted */
        .msg-wrap.dm-self .msg-bubble {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
        }

        .msg-wrap.dm-other .msg-bubble {
            background: rgba(168, 85, 247, .12);
            border: 1px solid rgba(168, 85, 247, .3);
            color: #e2e8f0;
            border-radius: 14px 14px 14px 4px;
        }

        .dm-indicator {
            font-size: 9px;
            color: #a855f7;
            margin-bottom: 2px;
            padding: 0 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .msg-meta {
            font-size: 10px;
            color: #475569;
            margin-top: 2px;
            padding: 0 2px;
        }

        .msg-name {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2px;
            font-size: 11px;
            padding: 0 2px;
        }

        /* welcome */
        .welcome {
            text-align: center;
            color: #2d2d4e;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.6;
        }

        /* ─── Input Area ─────────────────────────────────────────── */
        .input-area {
            padding: 12px 16px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .msg-input {
            flex: 1;
            background: #111128;
            border: 1px solid #252545;
            border-radius: 12px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: none;
            transition: border-color .2s;
            max-height: 80px;
        }

        .msg-input:focus {
            border-color: #6366f1;
        }

        .msg-input.dm-mode {
            border-color: rgba(168, 85, 247, .4);
        }

        .msg-input.dm-mode:focus {
            border-color: #a855f7;
        }

        .msg-input:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .2s;
        }

        .btn-send.dm-mode {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .btn-send:hover {
            opacity: .85;
        }

        .btn-send:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        /* ─── Connect Modal ─────────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #161628;
            border: 1px solid #252545;
            border-radius: 18px;
            padding: 28px;
            width: 340px;
            animation: slideUp .2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            font-size: 11px;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .field input {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid #2d2d4e;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }

        .field input:focus {
            border-color: #6366f1;
        }

        .field input.err {
            border-color: #ef4444;
        }

        .btn-connect {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .2s;
        }

        .btn-connect:hover {
            opacity: .9;
        }

        /* ─── Scrollbar ─────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d2d4e;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <!-- Title Bar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <span class="tb-role-badge">CLIENT</span>
            <div class="status-pill">
                <div class="status-dot disconnected" id="status-dot"></div>
                <span class="status-pill-text" id="status-text">Not connected</span>
            </div>
        </div>
        <div class="titlebar-btns">
            <button class="tb-btn min" onclick="api.send('win-minimize',{})"></button>
            <button class="tb-btn close" onclick="api.send('win-close',{})"></button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-layout">
        <!-- Users Sidebar -->
        <div class="users-sidebar">
            <div class="sidebar-header">👥 Online Users</div>
            <div class="user-list" id="user-list">
                <div class="dm-hint" id="dm-hint">Connect to see users</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-main">
            <!-- Mode Indicator Bar -->
            <div class="chat-mode-bar" id="mode-bar">
                <span>🌐</span>
                <span class="mode-label" id="mode-label">Group Chat</span>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🔌</div>
                    <p>Connect to the server to start chatting.<br />Click a username on the left to send a private
                        message.</p>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-row">
                    <textarea class="msg-input" id="msg-input"
                        placeholder="Type a message... (Shift+Enter for new line)" rows="1" disabled></textarea>
                    <button class="btn-send" id="btn-send" onclick="sendMsg()" disabled>➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div class="modal-overlay" id="modal" style="display:none;">
        <div class="modal">
            <h2>💬 Join Chat</h2>
            <p>Enter your details to connect to the LAN server.</p>
            <div class="field"><label>Your Username</label><input id="m-username" placeholder="e.g. Alice"
                    maxlength="24" /></div>
            <div class="field"><label>Server IP Address</label><input id="m-host" placeholder="e.g. 192.168.1.101"
                    value="127.0.0.1" /></div>
            <div class="field"><label>Port</label><input id="m-port" placeholder="65432" value="65432" /></div>
            <button class="btn-connect" onclick="doConnect()">Connect →</button>
        </div>
    </div>

    <script>
        let myUsername = '';
        let isConnected = false;
        let dmTarget = null;          // null = group chat, 'username' = DM mode
        const unreadCounts = {};      // username -> unread DM count
        const dmHistories = {};       // username -> [{...msg}]  (stored per-thread)
        let onlineUsers = [];

        // ─── Connect Modal ──────────────────────────────────────────
        api.on('request-connect-info', () => {
            document.getElementById('modal').style.display = 'flex';
            setTimeout(() => document.getElementById('m-username').focus(), 100);
        });

        function doConnect() {
            const username = document.getElementById('m-username').value.trim();
            const host = document.getElementById('m-host').value.trim() || '127.0.0.1';
            const port = document.getElementById('m-port').value.trim() || '65432';
            if (!username) { document.getElementById('m-username').classList.add('err'); return; }
            myUsername = username;
            document.getElementById('modal').style.display = 'none';
            document.getElementById('welcome').style.display = 'none';
            api.send('client-connect', { host, port, username });
        }

        // ─── DM / Group Mode Switch ─────────────────────────────────
        function openDM(username) {
            if (username === myUsername) return; // can't DM yourself
            dmTarget = username;
            unreadCounts[username] = 0;
            renderUserList();

            // Update mode bar
            const bar = document.getElementById('mode-bar');
            bar.className = 'chat-mode-bar dm-mode';
            document.getElementById('mode-label').textContent = `🔒 Private: ${username}`;
            bar.innerHTML = `<span>🔒</span>
                <span class="mode-label">Private chat with <strong>${escapeHtml(username)}</strong></span>
                <button class="btn-back-to-group" onclick="openGroupChat()">← Back to Group</button>`;

            // Update input style
            document.getElementById('msg-input').className = 'msg-input dm-mode';
            document.getElementById('msg-input').placeholder = `Message ${username} privately...`;
            document.getElementById('btn-send').className = 'btn-send dm-mode';

            // Show DM history for this user
            renderDMHistory(username);
        }

        function openGroupChat() {
            dmTarget = null;
            const bar = document.getElementById('mode-bar');
            bar.className = 'chat-mode-bar';
            bar.innerHTML = '<span>🌐</span><span class="mode-label" id="mode-label">Group Chat</span>';

            document.getElementById('msg-input').className = 'msg-input';
            document.getElementById('msg-input').placeholder = 'Type a message... (Shift+Enter for new line)';
            document.getElementById('btn-send').className = 'btn-send';

            renderUserList();
            renderGroupHistory();
        }

        // ─── Send ───────────────────────────────────────────────────
        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !isConnected) return;

            if (dmTarget) {
                api.send('client-send-dm', { to: dmTarget, text });
                // We'll see our own DM echoed back from server
            } else {
                api.send('client-send', { text });
                appendGroupMessage({ type: 'chat', from: myUsername, text, ts: Date.now() }, true);
            }
            input.value = '';
            input.style.height = 'auto';
        }

        // ─── Group history storage ──────────────────────────────────
        const groupHistory = [];
        function appendGroupMessage(msg, isSelf = false) {
            groupHistory.push({ msg, isSelf });
            if (!dmTarget) renderGroupMsg(msg, isSelf);
        }

        function renderGroupHistory() {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            for (const { msg, isSelf } of groupHistory) renderGroupMsg(msg, isSelf);
            container.scrollTop = container.scrollHeight;
        }

        function renderGroupMsg(msg, isSelf) {
            const container = document.getElementById('messages');
            if (dmTarget) return; // Not in group mode, skip rendering
            const wrap = document.createElement('div');
            if (msg.type === 'system') {
                wrap.className = 'msg-wrap system';
                wrap.innerHTML = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
            } else {
                wrap.className = `msg-wrap ${isSelf ? 'self' : 'other'}`;
                const time = new Date(msg.ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                if (!isSelf) wrap.innerHTML += `<div class="msg-name">${escapeHtml(msg.from)}</div>`;
                wrap.innerHTML += `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
                wrap.innerHTML += `<div class="msg-meta">${time}</div>`;
            }
            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        function renderDMHistory(username) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            const history = dmHistories[username] || [];
            for (const dm of history) renderDMMsg(dm, true); // force render
            container.scrollTop = container.scrollHeight;
        }

        function renderDMMsg(dm, forceRender = false) {
            const container = document.getElementById('messages');
            const isSelf = dm.from === myUsername;
            const threadUser = isSelf ? dm.to : dm.from;
            if (!forceRender && dmTarget !== threadUser) return;
            const wrap = document.createElement('div');
            wrap.className = `msg-wrap ${isSelf ? 'dm-self' : 'dm-other'}`;
            const time = new Date(dm.ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (!isSelf) wrap.innerHTML += `<div class="dm-indicator">🔒 ${escapeHtml(dm.from)}</div>`;
            else wrap.innerHTML += `<div class="dm-indicator" style="justify-content:flex-end">🔒 to ${escapeHtml(dm.to)}</div>`;
            wrap.innerHTML += `<div class="msg-bubble">${escapeHtml(dm.text)}</div>`;
            wrap.innerHTML += `<div class="msg-meta">${time}</div>`;
            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        // ─── Online Users List ──────────────────────────────────────
        function renderUserList() {
            const list = document.getElementById('user-list');
            const hint = document.getElementById('dm-hint');
            list.innerHTML = '';

            if (!isConnected || onlineUsers.length === 0) {
                const h = document.createElement('div');
                h.className = 'dm-hint';
                h.textContent = isConnected ? 'No other users online' : 'Connect to see users';
                list.appendChild(h);
                return;
            }

            // Sort: me first, then others
            const sorted = [myUsername, ...onlineUsers.filter(u => u !== myUsername)];
            for (const username of sorted) {
                if (!onlineUsers.includes(username) && username === myUsername) {
                    // Show self even if not in list yet
                }
                const item = document.createElement('div');
                item.className = 'user-item' + (dmTarget === username ? ' active-dm' : '');
                item.onclick = () => username !== myUsername && openDM(username);

                const initial = username.charAt(0).toUpperCase();
                const unread = unreadCounts[username] || 0;
                item.innerHTML = `
                    <div class="user-avatar">${escapeHtml(initial)}</div>
                    <span class="user-name${username === myUsername ? ' me' : ''}">${escapeHtml(username)}${username === myUsername ? ' (you)' : ''}</span>
                    ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                `;
                list.appendChild(item);
            }
        }

        // ─── Status ─────────────────────────────────────────────────
        function setStatus(status, host, port) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = 'status-dot';
            const input = document.getElementById('msg-input');
            const sendBtn = document.getElementById('btn-send');
            if (status === 'Connected') {
                dot.classList.add('connected');
                text.textContent = `${host}:${port}`;
                isConnected = true;
                input.disabled = false;
                sendBtn.disabled = false;
            } else if (status.startsWith('Reconnecting') || status === 'Connecting...') {
                dot.classList.add('reconnecting');
                text.textContent = status;
                isConnected = false;
                input.disabled = true;
                sendBtn.disabled = true;
            } else {
                dot.classList.add('disconnected');
                text.textContent = status || 'Disconnected';
                isConnected = false;
                input.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function escapeHtml(s) {
            if (typeof s !== 'string') return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ─── IPC Listeners ──────────────────────────────────────────
        api.on('message', (msg) => {
            const isSelf = (msg.type === 'chat' && msg.from === myUsername);
            if (!isSelf) appendGroupMessage(msg, false);
            // If we're in DM mode, still store but don't render group messages
        });

        api.on('status', (data) => setStatus(data.status, data.host, data.port));

        api.on('client-list', (data) => {
            onlineUsers = data.users || [];
            renderUserList();
        });

        api.on('dm', (dm) => {
            // Store in DM history
            const threadUser = dm.from === myUsername ? dm.to : dm.from;
            if (!dmHistories[threadUser]) dmHistories[threadUser] = [];
            dmHistories[threadUser].push(dm);

            if (dmTarget === threadUser) {
                // Currently viewing this DM thread — render immediately
                renderDMMsg(dm);
            } else if (dm.from !== myUsername) {
                // Unread DM from another user
                unreadCounts[threadUser] = (unreadCounts[threadUser] || 0) + 1;
                renderUserList();
                // Show subtle system notification in group chat
                appendGroupMessage({
                    type: 'system',
                    text: `📨 New private message from ${dm.from}`,
                    ts: Date.now()
                });
            }
        });

        api.on('failover', (data) => {
            appendGroupMessage({ type: 'system', text: `⚡ Failover! Switching to ${data.host}:${data.port}`, ts: Date.now() });
        });

        api.on('ack', (data) => {
            appendGroupMessage({ type: 'system', text: `✅ ${data.message}`, ts: Date.now() });
        });

        // ─── Textarea Auto-Grow + Enter to Send ─────────────────────
        const input = document.getElementById('msg-input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 80) + 'px';
        });
    </script>
</body>

</html>
