<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ChatSys — Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0b0b18;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ─── Titlebar ────────────────────────────────────────── */
        .titlebar {
            height: 42px;
            background: #07070f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            -webkit-app-region: drag;
            border-bottom: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tb-role-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(168, 85, 247, .15);
            color: #a855f7;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: .6px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #111128;
            border: 1px solid #1e1e3a;
            border-radius: 20px;
            padding: 3px 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #374151;
            transition: background .3s;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.reconnecting {
            background: #f59e0b;
            animation: blink .8s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        .status-pill-text {
            font-size: 10px;
            color: #64748b;
        }

        .titlebar-btns {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .tb-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .tb-btn.close {
            background: #ff5f57;
        }

        .tb-btn.min {
            background: #febc2e;
        }

        /* ─── App Layout ──────────────────────────────────────── */
        .app-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 190px 1fr;
            overflow: hidden;
        }

        /* ─── Users Sidebar ───────────────────────────────────── */
        .users-sidebar {
            background: #0d0d1f;
            border-right: 1px solid #1a1a30;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-hdr {
            padding: 12px 14px 8px;
            border-bottom: 1px solid #1a1a30;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s;
            border: 1px solid transparent;
        }

        .user-item:hover {
            background: #161628;
        }

        .user-item.active-dm {
            background: rgba(168, 85, 247, .1);
            border-color: rgba(168, 85, 247, .25);
        }

        .u-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .u-name {
            font-size: 12px;
            color: #c4c9d4;
            flex: 1;
        }

        .u-name.me {
            color: #a855f7;
        }

        .unread-dot {
            width: 16px;
            height: 16px;
            background: #a855f7;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dm-hint {
            font-size: 10px;
            color: #374151;
            padding: 8px;
            font-style: italic;
            text-align: center;
        }

        /* ─── Chat Main ───────────────────────────────────────── */
        .chat-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mode-bar {
            padding: 6px 14px;
            background: #0d0d1f;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #64748b;
            flex-shrink: 0;
        }

        .mode-bar .mode-lbl {
            font-weight: 600;
        }

        .mode-bar.dm {
            background: rgba(168, 85, 247, .07);
            border-bottom-color: rgba(168, 85, 247, .3);
        }

        .mode-bar.dm .mode-lbl {
            color: #a855f7;
        }

        .btn-back {
            margin-left: auto;
            background: none;
            border: 1px solid #2d2d4e;
            border-radius: 6px;
            padding: 3px 10px;
            color: #64748b;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-back:hover {
            border-color: #a855f7;
            color: #a855f7;
        }

        /* messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-wrap {
            display: flex;
            flex-direction: column;
            max-width: 74%;
        }

        .msg-wrap.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrap.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-wrap.system {
            align-self: center;
            align-items: center;
            max-width: 90%;
        }

        .msg-wrap.dm-self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrap.dm-other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-wrap.self .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
        }

        .msg-wrap.other .msg-bubble {
            background: #161628;
            border: 1px solid #252545;
            color: #e2e8f0;
            border-radius: 14px 14px 14px 4px;
        }

        .msg-wrap.system .msg-bubble {
            background: #111128;
            border: 1px solid #252545;
            color: #64748b;
            font-size: 11px;
            border-radius: 20px;
            padding: 4px 14px;
            text-align: center;
        }

        .msg-wrap.dm-self .msg-bubble {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
        }

        .msg-wrap.dm-other .msg-bubble {
            background: rgba(168, 85, 247, .12);
            border: 1px solid rgba(168, 85, 247, .3);
            color: #e2e8f0;
            border-radius: 14px 14px 14px 4px;
        }

        .dm-lbl {
            font-size: 9px;
            color: #a855f7;
            margin-bottom: 2px;
            padding: 0 2px;
        }

        .msg-meta {
            font-size: 10px;
            color: #475569;
            margin-top: 2px;
            padding: 0 2px;
        }

        .msg-name {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2px;
            font-size: 11px;
            padding: 0 2px;
        }

        /* image bubble */
        .img-bubble {
            max-width: 240px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #252545;
        }

        .img-bubble img {
            width: 100%;
            display: block;
        }

        .img-caption {
            font-size: 10px;
            color: #64748b;
            padding: 4px 8px;
            background: #111128;
        }

        /* welcome */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2d2d4e;
            padding: 30px;
        }

        .welcome-icon {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.6;
        }

        /* ─── Input Area ──────────────────────────────────────── */
        .input-area {
            padding: 10px 14px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .msg-input {
            flex: 1;
            background: #111128;
            border: 1px solid #252545;
            border-radius: 12px;
            padding: 10px 13px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: none;
            transition: border-color .2s;
            max-height: 80px;
        }

        .msg-input:focus {
            border-color: #6366f1;
        }

        .msg-input.dm-mode {
            border-color: rgba(168, 85, 247, .4);
        }

        .msg-input.dm-mode:focus {
            border-color: #a855f7;
        }

        .msg-input:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #161628;
            border: 1px solid #252545;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .2s;
        }

        .btn-img:hover {
            border-color: #6366f1;
            background: #1e1e3a;
        }

        .btn-img:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .2s;
        }

        .btn-send.dm-mode {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .btn-send:hover {
            opacity: .85;
        }

        .btn-send:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        /* image preview bar */
        .img-preview-bar {
            display: none;
            padding: 8px 14px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            align-items: center;
            gap: 10px;
        }

        .img-preview-bar.visible {
            display: flex;
        }

        .img-preview-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #252545;
        }

        .img-preview-name {
            font-size: 11px;
            color: #94a3b8;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-cancel-img {
            background: none;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 3px 10px;
            color: #64748b;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel-img:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* ─── Modal ───────────────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #161628;
            border: 1px solid #252545;
            border-radius: 18px;
            padding: 26px;
            width: 335px;
            animation: slideUp .2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 11px;
        }

        .field label {
            font-size: 11px;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .field input {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid #2d2d4e;
            border-radius: 8px;
            padding: 9px 12px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }

        .field input:focus {
            border-color: #6366f1;
        }

        .field input.err {
            border-color: #ef4444;
        }

        .btn-connect {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .2s;
        }

        .btn-connect:hover {
            opacity: .9;
        }

        /* image lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: zoom-out;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d2d4e;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <!-- Hidden file input -->
    <input type="file" id="file-picker" accept="image/*" style="display:none;" />

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="" />
    </div>

    <!-- Titlebar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <span class="tb-role-badge">CLIENT</span>
            <div class="status-pill">
                <div class="status-dot disconnected" id="status-dot"></div>
                <span class="status-pill-text" id="status-text">Not connected</span>
            </div>
        </div>
        <div class="titlebar-btns">
            <button class="tb-btn min" onclick="api.send('win-minimize',{})"></button>
            <button class="tb-btn close" onclick="api.send('win-close',{})"></button>
        </div>
    </div>

    <!-- App -->
    <div class="app-layout">
        <!-- Users Sidebar -->
        <div class="users-sidebar">
            <div class="sidebar-hdr">👥 Online Users</div>
            <div class="user-list" id="user-list">
                <div class="dm-hint">Connect to see users</div>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-main">
            <div class="mode-bar" id="mode-bar">
                <span>🌐</span><span class="mode-lbl">Group Chat</span>
            </div>
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🔌</div>
                    <p>Connect to the server to start chatting.<br />Click a user to send a private message.<br />Use 📎
                        to share images.</p>
                </div>
            </div>
            <!-- Image preview bar -->
            <div class="img-preview-bar" id="img-preview-bar">
                <img class="img-preview-thumb" id="img-preview-thumb" src="" alt="preview" />
                <span class="img-preview-name" id="img-preview-name"></span>
                <button class="btn-cancel-img" onclick="cancelImage()">✕ Cancel</button>
            </div>
            <div class="input-area">
                <div class="input-row">
                    <button class="btn-img" id="btn-img" onclick="pickImage()" disabled title="Send image">📎</button>
                    <textarea class="msg-input" id="msg-input"
                        placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1"
                        disabled></textarea>
                    <button class="btn-send" id="btn-send" onclick="sendMsg()" disabled>➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div class="modal-overlay" id="modal" style="display:none;">
        <div class="modal">
            <h2>💬 Join Chat</h2>
            <p>Enter your details to connect to the LAN server.</p>
            <div class="field"><label>Username</label><input id="m-username" placeholder="e.g. Alice" maxlength="24" />
            </div>
            <div class="field"><label>Server IP</label><input id="m-host" value="127.0.0.1" /></div>
            <div class="field"><label>Port</label><input id="m-port" value="65432" /></div>
            <button class="btn-connect" onclick="doConnect()">Connect →</button>
        </div>
    </div>

    <script>
        let myUsername = '';
        let isConnected = false;
        let dmTarget = null;
        const unreadCounts = {};
        const dmHistories = {};
        const groupHistory = [];
        let onlineUsers = [];
        let pendingImage = null; // { data, filename, mimeType }

        // ─── Modal ───────────────────────────────────────────────────
        api.on('request-connect-info', () => {
            document.getElementById('modal').style.display = 'flex';
            setTimeout(() => document.getElementById('m-username').focus(), 100);
        });

        function doConnect() {
            const username = document.getElementById('m-username').value.trim();
            const host = document.getElementById('m-host').value.trim() || '127.0.0.1';
            const port = document.getElementById('m-port').value.trim() || '65432';
            if (!username) { document.getElementById('m-username').classList.add('err'); return; }
            myUsername = username;
            document.getElementById('modal').style.display = 'none';
            document.getElementById('welcome').style.display = 'none';
            api.send('client-connect', { host, port, username });
        }

        // ─── Image Picker ─────────────────────────────────────────────
        function pickImage() {
            document.getElementById('file-picker').click();
        }

        document.getElementById('file-picker').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Image too large (max 5MB)'); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                pendingImage = { data: ev.target.result, filename: file.name, mimeType: file.type };
                document.getElementById('img-preview-thumb').src = ev.target.result;
                document.getElementById('img-preview-name').textContent = file.name;
                document.getElementById('img-preview-bar').classList.add('visible');
                document.getElementById('msg-input').placeholder = 'Add a caption (optional)...';
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function cancelImage() {
            pendingImage = null;
            document.getElementById('img-preview-bar').classList.remove('visible');
            document.getElementById('msg-input').placeholder = dmTarget
                ? `Message ${dmTarget} privately...`
                : 'Type a message... (Enter to send, Shift+Enter for new line)';
        }

        // ─── Send ──────────────────────────────────────────────────────
        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!isConnected) return;

            if (pendingImage) {
                // Send image (with optional text caption)
                const to = dmTarget || null;
                api.send('client-send-image', {
                    to,
                    data: pendingImage.data,
                    filename: pendingImage.filename,
                    mimeType: pendingImage.mimeType
                });
                cancelImage();
                input.value = '';
                input.style.height = 'auto';
            } else if (text) {
                if (dmTarget) {
                    api.send('client-send-dm', { to: dmTarget, text });
                } else {
                    api.send('client-send', { text });
                    appendGroupMsg({ type: 'chat', from: myUsername, text, ts: Date.now() }, true);
                }
                input.value = '';
                input.style.height = 'auto';
            }
        }

        // ─── DM Navigation ────────────────────────────────────────────
        function openDM(username) {
            if (username === myUsername) return;
            dmTarget = username;
            unreadCounts[username] = 0;
            renderUserList();

            const bar = document.getElementById('mode-bar');
            bar.className = 'mode-bar dm';
            bar.innerHTML = `<span>🔒</span><span class="mode-lbl">Private: <strong>${escH(username)}</strong></span>
                <button class="btn-back" onclick="openGroup()">← Group Chat</button>`;

            const inp = document.getElementById('msg-input');
            inp.className = 'msg-input dm-mode';
            inp.placeholder = `Message ${username} privately...`;
            document.getElementById('btn-send').className = 'btn-send dm-mode';

            renderDMHistory(username);
        }

        function openGroup() {
            dmTarget = null;
            cancelImage();
            const bar = document.getElementById('mode-bar');
            bar.className = 'mode-bar';
            bar.innerHTML = '<span>🌐</span><span class="mode-lbl">Group Chat</span>';
            document.getElementById('msg-input').className = 'msg-input';
            document.getElementById('msg-input').placeholder = 'Type a message... (Enter to send, Shift+Enter for new line)';
            document.getElementById('btn-send').className = 'btn-send';
            renderUserList();
            renderGroupHistory();
        }

        // ─── Render helpers ────────────────────────────────────────────
        function appendGroupMsg(msg, isSelf = false) {
            groupHistory.push({ msg, isSelf });
            if (!dmTarget) renderGroupMsgEl(msg, isSelf);
        }

        function renderGroupHistory() {
            const c = document.getElementById('messages');
            c.innerHTML = '';
            for (const { msg, isSelf } of groupHistory) renderGroupMsgEl(msg, isSelf);
            c.scrollTop = c.scrollHeight;
        }

        function renderGroupMsgEl(msg, isSelf) {
            if (dmTarget) return;
            const c = document.getElementById('messages');
            const wrap = document.createElement('div');
            if (msg.type === 'system') {
                wrap.className = 'msg-wrap system';
                wrap.innerHTML = `<div class="msg-bubble">${escH(msg.text)}</div>`;
            } else {
                wrap.className = `msg-wrap ${isSelf ? 'self' : 'other'}`;
                const time = fmtTime(msg.ts);
                if (!isSelf) wrap.innerHTML += `<div class="msg-name">${escH(msg.from)}</div>`;
                wrap.innerHTML += `<div class="msg-bubble">${escH(msg.text)}</div>`;
                wrap.innerHTML += `<div class="msg-meta">${time}</div>`;
            }
            c.appendChild(wrap);
            c.scrollTop = c.scrollHeight;
        }

        function renderDMHistory(username) {
            const c = document.getElementById('messages');
            c.innerHTML = '';
            for (const dm of (dmHistories[username] || [])) renderDMEl(dm, true);
            c.scrollTop = c.scrollHeight;
        }

        function renderDMEl(dm, force = false) {
            const c = document.getElementById('messages');
            const isSelf = dm.from === myUsername || dm.from === '🖥️ Server' && dm.to === myUsername;
            const threadUser = isSelf && dm.from !== '🖥️ Server' ? dm.to : dm.from;
            if (!force && dmTarget !== threadUser) return;
            const wrap = document.createElement('div');
            wrap.className = `msg-wrap ${isSelf ? 'dm-self' : 'dm-other'}`;
            const time = fmtTime(dm.ts);
            if (isSelf)
                wrap.innerHTML += `<div class="dm-lbl" style="justify-content:flex-end">🔒 to ${escH(dm.to)}</div>`;
            else
                wrap.innerHTML += `<div class="dm-lbl">🔒 ${escH(dm.from)}</div>`;
            wrap.innerHTML += `<div class="msg-bubble">${escH(dm.text)}</div>`;
            wrap.innerHTML += `<div class="msg-meta">${time}</div>`;
            c.appendChild(wrap);
            c.scrollTop = c.scrollHeight;
        }

        function renderImageEl(img, isSelf) {
            const c = document.getElementById('messages');
            const wrapClass = img.to
                ? (isSelf ? 'dm-self' : 'dm-other')
                : (isSelf ? 'self' : 'other');
            const wrap = document.createElement('div');
            wrap.className = `msg-wrap ${wrapClass}`;
            const time = fmtTime(img.ts);
            if (!isSelf) wrap.innerHTML += `<div class="msg-name">${escH(img.from)}</div>`;
            wrap.innerHTML += `
                <div class="img-bubble" onclick="openLightbox('${img.data}')">
                    <img src="${img.data}" alt="${escH(img.filename)}" loading="lazy"/>
                    <div class="img-caption">📎 ${escH(img.filename)}</div>
                </div>
                <div class="msg-meta">${time}</div>`;
            c.appendChild(wrap);
            c.scrollTop = c.scrollHeight;
        }

        // ─── User List ─────────────────────────────────────────────────
        function renderUserList() {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            if (!isConnected || onlineUsers.length === 0) {
                const h = document.createElement('div');
                h.className = 'dm-hint';
                h.textContent = isConnected ? 'No other users online' : 'Connect to see users';
                list.appendChild(h);
                return;
            }
            const sorted = [myUsername, ...onlineUsers.filter(u => u !== myUsername)];
            for (const u of sorted) {
                if (!onlineUsers.includes(u)) continue;
                const item = document.createElement('div');
                item.className = 'user-item' + (dmTarget === u ? ' active-dm' : '');
                item.onclick = () => u !== myUsername && openDM(u);
                const unread = unreadCounts[u] || 0;
                item.innerHTML = `
                    <div class="u-avatar">${escH(u.charAt(0).toUpperCase())}</div>
                    <span class="u-name${u === myUsername ? ' me' : ''}">${escH(u)}${u === myUsername ? ' (you)' : ''}</span>
                    ${unread > 0 ? `<div class="unread-dot">${unread}</div>` : ''}`;
                list.appendChild(item);
            }
        }

        // ─── Status ───────────────────────────────────────────────────
        function setStatus(status, host, port) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            dot.className = 'status-dot';
            const inp = document.getElementById('msg-input');
            const btn = document.getElementById('btn-send');
            const imgBtn = document.getElementById('btn-img');
            if (status === 'Connected') {
                dot.classList.add('connected'); txt.textContent = `${host}:${port}`;
                isConnected = true; inp.disabled = false; btn.disabled = false; imgBtn.disabled = false;
            } else if (status.startsWith('Reconnecting') || status === 'Connecting...') {
                dot.classList.add('reconnecting'); txt.textContent = status;
                isConnected = false; inp.disabled = true; btn.disabled = true; imgBtn.disabled = true;
            } else {
                dot.classList.add('disconnected'); txt.textContent = status || 'Disconnected';
                isConnected = false; inp.disabled = true; btn.disabled = true; imgBtn.disabled = true;
            }
        }

        // ─── Lightbox ─────────────────────────────────────────────────
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('open');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        // ─── Helpers ──────────────────────────────────────────────────
        function escH(s) { if (typeof s !== 'string') return ''; return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function fmtTime(ts) { return new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

        // ─── IPC ──────────────────────────────────────────────────────
        api.on('message', (msg) => {
            const isSelf = msg.type === 'chat' && msg.from === myUsername;
            if (!isSelf) appendGroupMsg(msg, false);
        });

        api.on('status', (data) => setStatus(data.status, data.host, data.port));

        api.on('client-list', (data) => {
            onlineUsers = data.users || [];
            renderUserList();
        });

        api.on('dm', (dm) => {
            const threadUser = dm.from === myUsername ? dm.to : dm.from;
            if (!dmHistories[threadUser]) dmHistories[threadUser] = [];
            dmHistories[threadUser].push(dm);
            if (dmTarget === threadUser) {
                renderDMEl(dm);
            } else if (dm.from !== myUsername) {
                unreadCounts[threadUser] = (unreadCounts[threadUser] || 0) + 1;
                renderUserList();
                appendGroupMsg({ type: 'system', text: `📨 New private message from ${dm.from}`, ts: Date.now() });
            }
        });

        api.on('image', (img) => {
            const isSelf = img.from === myUsername;
            // If DM image, store in thread
            if (img.to) {
                const threadUser = isSelf ? img.to : img.from;
                if (dmTarget === threadUser) renderImageEl(img, isSelf);
                else if (!isSelf) {
                    unreadCounts[threadUser] = (unreadCounts[threadUser] || 0) + 1;
                    renderUserList();
                    appendGroupMsg({ type: 'system', text: `📎 Image from ${img.from} (private)`, ts: img.ts });
                }
            } else {
                // Group image
                if (!dmTarget) renderImageEl(img, isSelf);
            }
        });

        api.on('failover', (data) => appendGroupMsg({ type: 'system', text: `⚡ Failover! Switching to ${data.host}:${data.port}`, ts: Date.now() }));
        api.on('ack', (data) => appendGroupMsg({ type: 'system', text: `✅ ${data.message}`, ts: Date.now() }));

        // ─── Input behavior ───────────────────────────────────────────
        const inp = document.getElementById('msg-input');
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
        inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 80) + 'px'; });
    </script>
</body>

</html>
