<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ChatSys — Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b18;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Titlebar */
        .titlebar {
            height: 42px;
            background: #07070f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            -webkit-app-region: drag;
            border-bottom: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tb-role-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(168, 85, 247, .15);
            color: #a855f7;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: .6px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #111128;
            border: 1px solid #1e1e3a;
            border-radius: 20px;
            padding: 3px 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #374151;
            transition: background .3s;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.reconnecting {
            background: #f59e0b;
            animation: blink .8s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        .status-pill-text {
            font-size: 10px;
            color: #64748b;
        }

        .titlebar-btns {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .tb-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .tb-btn.close {
            background: #ff5f57;
        }

        .tb-btn.min {
            background: #febc2e;
        }

        /* Chat Layout */
        .chat-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-wrap {
            display: flex;
            flex-direction: column;
            max-width: 72%;
        }

        .msg-wrap.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrap.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-wrap.system {
            align-self: center;
            align-items: center;
            max-width: 80%;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-wrap.self .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-radius: 14px 14px 4px 14px;
        }

        .msg-wrap.other .msg-bubble {
            background: #161628;
            border: 1px solid #252545;
            color: #e2e8f0;
            border-radius: 14px 14px 14px 4px;
        }

        .msg-wrap.system .msg-bubble {
            background: #111128;
            border: 1px solid #252545;
            color: #64748b;
            font-size: 11px;
            text-align: center;
            border-radius: 20px;
            padding: 5px 14px;
        }

        .msg-meta {
            font-size: 10px;
            color: #475569;
            margin-top: 3px;
            padding: 0 2px;
        }

        .msg-name {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2px;
            font-size: 11px;
            padding: 0 2px;
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            background: #0d0d1f;
            border-top: 1px solid #1a1a30;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .msg-input {
            flex: 1;
            background: #111128;
            border: 1px solid #252545;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            transition: border-color .2s;
            max-height: 80px;
        }

        .msg-input:focus {
            border-color: #6366f1;
        }

        .msg-input:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-send {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .2s;
        }

        .btn-send:hover {
            opacity: .85;
        }

        .btn-send:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #161628;
            border: 1px solid #252545;
            border-radius: 18px;
            padding: 28px 28px 24px;
            width: 340px;
            animation: slideUp .2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .modal .field {
            margin-bottom: 12px;
        }

        .modal .field label {
            font-size: 11px;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .modal .field input {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid #2d2d4e;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color .2s;
        }

        .modal .field input:focus {
            border-color: #6366f1;
        }

        .modal .field input.err {
            border-color: #ef4444;
        }

        .btn-connect {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity .2s;
        }

        .btn-connect:hover {
            opacity: .9;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d2d4e;
            border-radius: 2px;
        }

        /* Welcome */
        .welcome {
            text-align: center;
            color: #2d2d4e;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="titlebar">
        <div class="titlebar-left">
            <span class="tb-role-badge">CLIENT</span>
            <div class="status-pill">
                <div class="status-dot disconnected" id="status-dot"></div>
                <span class="status-pill-text" id="status-text">Not connected</span>
            </div>
        </div>
        <div class="titlebar-btns">
            <button class="tb-btn min" onclick="api.send('win-minimize',{})"></button>
            <button class="tb-btn close" onclick="api.send('win-close',{})"></button>
        </div>
    </div>

    <!-- Connect Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>💬 Join Chat</h2>
            <p>Enter your details to connect to the LAN server.</p>
            <div class="field"><label>Your Username</label><input id="m-username" placeholder="e.g. Alice"
                    maxlength="24" /></div>
            <div class="field"><label>Server IP Address</label><input id="m-host" placeholder="e.g. 192.168.1.101"
                    value="127.0.0.1" /></div>
            <div class="field"><label>Port</label><input id="m-port" placeholder="65432" value="65432" /></div>
            <button class="btn-connect" onclick="doConnect()">Connect →</button>
        </div>
    </div>

    <div class="chat-layout">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🔌</div>
                <p>Connect to the server to start chatting.<br />Messages will appear here.</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-row">
                <textarea class="msg-input" id="msg-input" placeholder="Type a message..." rows="1" disabled></textarea>
                <button class="btn-send" id="btn-send" onclick="sendMsg()" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        let myUsername = '';
        let isConnected = false;

        // Triggered by main.js after window loads
        api.on('request-connect-info', () => {
            document.getElementById('modal').style.display = 'flex';
        });

        function doConnect() {
            const username = document.getElementById('m-username').value.trim();
            const host = document.getElementById('m-host').value.trim() || '127.0.0.1';
            const port = document.getElementById('m-port').value.trim() || '65432';
            if (!username) { document.getElementById('m-username').classList.add('err'); return; }
            myUsername = username;
            document.getElementById('modal').style.display = 'none';
            document.getElementById('welcome').style.display = 'none';
            api.send('client-connect', { host, port, username });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !isConnected) return;
            api.send('client-send', { text });
            appendMessage({ type: 'chat', from: myUsername, text, ts: Date.now() }, true);
            input.value = '';
            input.style.height = 'auto';
        }

        function appendMessage(msg, isSelf = false) {
            const container = document.getElementById('messages');
            const wrap = document.createElement('div');

            if (msg.type === 'system') {
                wrap.className = 'msg-wrap system';
                wrap.innerHTML = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
            } else {
                wrap.className = `msg-wrap ${isSelf ? 'self' : 'other'}`;
                const time = new Date(msg.ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                if (!isSelf) wrap.innerHTML += `<div class="msg-name">${escapeHtml(msg.from)}</div>`;
                wrap.innerHTML += `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
                wrap.innerHTML += `<div class="msg-meta">${time}</div>`;
            }

            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        function setStatus(status, host, port) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = 'status-dot';
            if (status === 'Connected') {
                dot.classList.add('connected');
                text.textContent = `${host}:${port}`;
                isConnected = true;
                document.getElementById('msg-input').disabled = false;
                document.getElementById('btn-send').disabled = false;
            } else if (status.startsWith('Reconnecting')) {
                dot.classList.add('reconnecting');
                text.textContent = status;
                isConnected = false;
                document.getElementById('msg-input').disabled = true;
                document.getElementById('btn-send').disabled = true;
            } else {
                dot.classList.add('disconnected');
                text.textContent = status;
                isConnected = false;
                document.getElementById('msg-input').disabled = true;
                document.getElementById('btn-send').disabled = true;
            }
        }

        function escapeHtml(s) {
            if (typeof s !== 'string') return '';
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // IPC
        api.on('message', (msg) => {
            const isSelf = (msg.type === 'chat' && msg.from === myUsername);
            if (!isSelf) appendMessage(msg, false);
        });
        api.on('status', (data) => setStatus(data.status, data.host, data.port));
        api.on('failover', (data) => {
            appendMessage({ type: 'system', text: `⚡ Failover! Switching to new Primary at ${data.host}:${data.port}`, ts: Date.now() });
        });
        api.on('ack', (data) => {
            appendMessage({ type: 'system', text: `✅ ${data.message}`, ts: Date.now() });
        });

        // Textarea auto-grow + Enter to send
        const input = document.getElementById('msg-input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 80) + 'px';
        });
    </script>
</body>

</html>
