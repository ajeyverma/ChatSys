<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatSys — Launch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Title Bar */
    .titlebar {
      height: 38px;
      background: #0a0a14;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 0;
      -webkit-app-region: drag;
      border-bottom: 1px solid #1e1e3a;
    }

    .titlebar-title {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }

    .titlebar-btns {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s;
    }

    .win-btn svg {
      width: 10px;
      height: 10px;
      fill: #94a3b8;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .win-btn:hover svg {
      fill: #e2e8f0;
    }

    .win-btn.win-close:hover {
      background: #e81123;
    }

    .win-btn.win-close:hover svg {
      fill: #ffffff;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 36px;
    }

    .logo-area {
      text-align: center;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, .35);
    }

    .logo-area h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .logo-area p {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
      max-width: 360px;
      line-height: 1.5;
    }

    /* Config Panel */
    .config-panel {
      background: #161628;
      border: 1px solid #252545;
      border-radius: 14px;
      padding: 24px 28px;
      width: 100%;
      max-width: 360px;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .config-panel h4 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      font-size: 11px;
      color: #64748b;
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2d2d4e;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s;
    }

    .field input:focus {
      border-color: #6366f1;
    }

    .btn-launch {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
    }

    .btn-launch:hover {
      opacity: .9;
    }

    .back-link {
      font-size: 11px;
      color: #475569;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
      text-decoration: underline;
    }

    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="titlebar">
    <span class="titlebar-title">ChatSys — Fault-Tolerant LAN Communication</span>
    <div class="titlebar-btns">
      <div class="win-btn win-min" onclick="api.send('win-minimize',{})">
        <svg viewBox="0 0 10 1">
          <rect x="0" y="0" width="10" height="1"></rect>
        </svg>
      </div>
      <div class="win-btn win-close" onclick="api.send('win-close',{})">
        <svg viewBox="0 0 10 10">
          <polygon points="10,0.7 9.3,0 5,4.3 0.7,0 0,0.7 4.3,5 0,9.3 0.7,10 5,5.7 9.3,10 10,9.3 5.7,5"></polygon>
        </svg>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="logo-area">
      <div class="logo-icon">💬</div>
      <h1>ChatSys</h1>
      <p>Fault-tolerant LAN communication. Join a network or we'll automatically host one for you.</p>
    </div>

    <!-- Config Panel -->
    <div class="config-panel" id="config-panel">
      <div class="field">
        <label>Your Username</label>
        <input id="username" placeholder="e.g. Alice" maxlength="24" autocomplete="off" />
      </div>
      <div class="field">
        <label>Network IP</label>
        <input id="serverHost" placeholder="e.g. 192.168.1.101" value="127.0.0.1" />
      </div>
      <div class="field">
        <label>Port</label>
        <input id="serverPort" placeholder="65432" value="65432" />
      </div>
      <button class="btn-launch" id="btn-launch" onclick="launch()" style="margin-top: 10px;">Connect</button>

      <div style="font-size: 10px; color: #475569; text-align: center; margin-top: 16px; font-style: italic;">
        If a server does not exist at this address, ChatSys will automatically boot a Primary Server in the background.
      </div>
    </div>
  </div>

  <script>
    function launch() {
      const username = (document.getElementById('username').value || '').trim();
      if (!username) {
        document.getElementById('username').style.borderColor = '#ef4444';
        return;
      }

      const host = document.getElementById('serverHost').value || '127.0.0.1';
      const port = document.getElementById('serverPort').value || '65432';

      api.send('client-launch', { username, host, port });
    }

    // Launch on Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') launch();
    });
  </script>
</body>

</html>
