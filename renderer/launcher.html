<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="themes.css" />
  <script src="theme_manager.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Title Bar */
    .titlebar {
      height: 38px;
      background: var(--bg-titlebar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 0;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
    }

    .titlebar-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .titlebar-btns {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s;
    }

    .win-btn svg {
      width: 10px;
      height: 10px;
      fill: var(--text-muted);
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .win-btn:hover svg {
      fill: var(--text-main);
    }

    [data-theme="light"] .win-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .win-btn.win-close:hover {
      background: #e81123;
    }

    .win-btn.win-close:hover svg {
      fill: #ffffff;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 32px 48px;
      gap: 40px;
    }

    .logo-area {
      flex: 1;
      text-align: left;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 0 16px 0;
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .logo-area h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo-area p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      max-width: 360px;
      line-height: 1.5;
    }

    /* Config Panel */
    .config-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      width: 100%;
      max-width: 320px;
      animation: fadeIn .4s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text-main);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .btn-launch {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
    }

    .btn-launch:hover {
      opacity: .9;
    }

    /* Theme Select */
    .theme-selector {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .theme-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .theme-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="titlebar">
    <span class="titlebar-title">ChatSys — Fault-Tolerant LAN Communication</span>
    <div class="titlebar-btns">
      <div class="win-btn win-min" onclick="api.send('win-minimize',{})">
        <svg viewBox="0 0 10 1">
          <rect x="0" y="0" width="10" height="1"></rect>
        </svg>
      </div>
      <div class="win-btn win-close" onclick="api.send('win-close',{})">
        <svg viewBox="0 0 10 10">
          <polygon points="10,0.7 9.3,0 5,4.3 0.7,0 0,0.7 4.3,5 0,9.3 0.7,10 5,5.7 9.3,10 10,9.3 5.7,5"></polygon>
        </svg>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="logo-area">
      <div class="logo-icon">💬</div>
      <h1>ChatSys</h1>
      <p>Fault-tolerant LAN communication. Join a network or we'll automatically host one for you.</p>
    </div>

    <!-- Config Panel -->
    <div class="config-panel" id="config-panel">
      <div class="field">
        <label>Your Username</label>
        <input id="username" placeholder="e.g. Alice" maxlength="24" autocomplete="off" />
      </div>
      <div class="field">
        <label>Network IP</label>
        <input id="serverHost" placeholder="e.g. 192.168.1.101" value="127.0.0.1" />
      </div>
      <div class="field">
        <label>Port</label>
        <input id="serverPort" placeholder="65432" value="65432" />
      </div>
      <button class="btn-launch" id="btn-launch" onclick="launch()" style="margin-top: 10px;">Connect</button>

      <!-- Theme Switcher -->
      <div class="theme-selector">
        <button class="theme-btn" id="theme-default" onclick="setTheme('default')">Default</button>
        <button class="theme-btn" id="theme-light" onclick="setTheme('light')">Light</button>
        <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')">Dark</button>
      </div>

      <div style="font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 16px; font-style: italic;">
        If a server does not exist at this address, ChatSys will automatically boot a Primary Server in the background.
      </div>
      <div id="discovery-msg"
        style="font-size: 11px; color: #10b981; text-align: center; margin-top: 10px; font-weight: 500; display: none; animation: fadeIn .3s ease;">
        <!-- Discovered server message goes here -->
      </div>
    </div>
  </div>

  <script>
    // Theme UI sync
    function setTheme(t) {
      ThemeManager.apply(t);
      updateThemeUI();
    }

    function updateThemeUI() {
      const current = ThemeManager.getCurrent();
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`theme-${current}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // Run on start
    updateThemeUI();

    function launch() {
      const username = (document.getElementById('username').value || '').trim();
      if (!username) {
        document.getElementById('username').style.borderColor = '#ef4444';
        return;
      }

      const host = document.getElementById('serverHost').value || '127.0.0.1';
      const port = document.getElementById('serverPort').value || '65432';

      api.send('client-launch', { username, host, port });
    }

    // Launch on Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') launch();
    });

    // Handle incoming discovered server
    api.receive('server-discovered', (data) => {
      if (!data || !data.host) return;

      const hostInput = document.getElementById('serverHost');
      const portInput = document.getElementById('serverPort');
      const msgDiv = document.getElementById('discovery-msg');

      hostInput.value = data.host;
      portInput.value = data.port || '65432';

      msgDiv.innerHTML = `🎯 Discovered server at ${data.host}:${data.port || 65432}`;
      msgDiv.style.display = 'block';

      // Slight highlight effect to draw attention
      hostInput.style.borderColor = '#10b981';
      setTimeout(() => hostInput.style.borderColor = '#2d2d4e', 1500);
    });
  </script>
</body>

</html>
